name: Release

# ─────────────────────────────────────────────────────────────────────────────
# Produces platform-specific zips and publishes them to GitHub Releases.
#
#   • Every merge / push to `main`   → automatic ALPHA prerelease (versioned)
#   • Every push to `master`         → STABLE release
#   • Manual "Run workflow" button   → choose the channel yourself
#
# The version is computed by `dev.py` as major.minor.YYMMDDHHmm (with a
# `-alpha` suffix on the alpha channel) and is baked into the plugin itself
# (Content/Python/bk_unreal/_build_version.py) so users/admins can see exactly
# what they have installed. Both channels tag as `v<version>`; alpha tags just
# carry the `-alpha` suffix (e.g. `v0.1.2607101129-alpha`) and are marked as
# pre-release.
#
# CLIENT BINARIES:
#   The Go client lives in its own repo (BlenderKit/bk_client). `dev.py release`
#   downloads the *signed* `bk_client.zip` from that repo's GitHub Releases —
#   we never build/sign the client here, so the shipped binaries are the
#   correctly code-signed/notarized ones. Pass `--client-build <bk_client.zip>`
#   (or set BLENDKIT_CLIENT_BINARIES) to use a locally downloaded signed bundle.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel to build'
        type: choice
        options: [alpha, stable]
        default: stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANNEL="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            CHANNEL="alpha"
          else
            CHANNEL="stable"
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Selected channel: $CHANNEL"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine shared version
        id: version
        run: |
          python dev.py stamp --channel "${{ steps.channel.outputs.channel }}"
          VERSION=$(python -c "import runpy; print(runpy.run_path('Content/Python/bk_unreal/_build_version.py')['VERSION'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
          - os: ubuntu-22.04
            platform: linux-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build plugin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python dev.py release
          --channel "${{ needs.prepare.outputs.channel }}"
          --version "${{ needs.prepare.outputs.version }}"

      - name: Verify native Python package
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          import zipfile

          verification = "\n".join([
              "import sys",
              "sys.path[:0] = sys.argv[1:]",
              "import requests",
              "from bk_unreal import unreal_plugin",
              "from bk_unreal.core import download, editor_thread, placement",
              "from bk_unreal.ui_native import asset_bar_native, settings",
              "print('Verified native Python imports without Unreal or Qt')",
          ])
          with tempfile.TemporaryDirectory() as directory:
              with zipfile.ZipFile("out/Blendkit-${{ needs.prepare.outputs.version }}.zip") as package:
                retired = {"PySide6", "shiboken6", "qtpy"}
                if any(retired.intersection(name.split("/")) for name in package.namelist()):
                  raise RuntimeError("Package contains retired Qt dependencies")
                  package.extractall(directory)
              python_dir = os.path.join(directory, "Blendkit", "Content", "Python")
              lib_dir = os.path.join(python_dir, "bk_unreal", "lib")
              subprocess.run([sys.executable, "-I", "-S", "-c", verification, python_dir, lib_dir], check=True)
          PY

      - name: Name platform package
        run: |
          mv "out/Blendkit-${{ needs.prepare.outputs.version }}.zip" \
            "out/Blendkit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip"

      - name: Upload platform package
        uses: actions/upload-artifact@v4
        with:
          name: Blendkit-${{ matrix.platform }}
          path: out/Blendkit-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}.zip
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: Blendkit-*
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "Blendkit-unreal ${{ needs.prepare.outputs.version }}"
          prerelease: ${{ needs.prepare.outputs.channel == 'alpha' }}
          fail_on_unmatched_files: true
          body: |
            Blendkit-unreal **${{ needs.prepare.outputs.version }}** (${{ needs.prepare.outputs.channel }}).

            - Commit: `${{ github.sha }}`
            - Download the ZIP matching your platform: **windows-x64**, **macos-arm64**, or **linux-x64**.

            **Install:** unzip and copy the `Blendkit/` folder into your
            Unreal project's `Plugins/` directory, then restart the editor.

            The UI uses Unreal's native Slate tabs; no Qt installation is required. The native `BlendkitViewport`
            module is shipped as source and must be compiled for your Unreal Engine version.
          files: out/Blendkit-${{ needs.prepare.outputs.version }}-*.zip
